name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      # Question JSON files are gitignored. If the runner injects them
      # (e.g. decoded from a secret), copy them into the web assets.
      # Without data the app still builds and runs (shows a load error).
      - name: Copy question data if present
        run: |
          mkdir -p dist/questions
          if ls questions/*.json >/dev/null 2>&1; then
            cp questions/*.json dist/questions/
            ls dist/questions/
          else
            echo "no question data, skipping"
          fi

      # android/ is gitignored, so recreate the platform, then re-apply
      # the kotlin-stdlib-jdk7/jdk8 global exclude (cordova pulls 1.6.21
      # split artifacts that duplicate classes in kotlin-stdlib 1.8+).
      - name: Setup Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          if 'kotlin-stdlib-jdk7' not in s:
              s = s.replace(
                  "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}",
                  "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n"
                  "    configurations.all {\n"
                  "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n"
                  "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n"
                  "    }\n}",
              )
              p.write_text(s)
              print('patched android/build.gradle')
          else:
              print('already patched')
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Signing is optional: when these secrets exist the APK is signed,
      # otherwise an unsigned release APK is built.
      # Secrets: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restore signing key if secrets present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "keystore restored"
          else
            echo "no signing secrets, building unsigned"
          fi

      - name: Apply release signing config if keystore present
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs' not in s:
              s = s.replace(
                  "    buildTypes {\n        release {\n            minifyEnabled false\n"
                  "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                  "        }\n    }",
                  "    def storeFilePath = System.getenv('KEYSTORE_FILE') ?: 'release.keystore'\n"
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file(storeFilePath)\n"
                  "            storePassword System.getenv('KEYSTORE_PASSWORD')\n"
                  "            keyAlias System.getenv('KEY_ALIAS')\n"
                  "            keyPassword System.getenv('KEY_PASSWORD')\n"
                  "        }\n"
                  "    }\n"
                  "    buildTypes {\n"
                  "        release {\n"
                  "            minifyEnabled false\n"
                  "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                  "            if (file(storeFilePath).exists() || System.getenv('KEYSTORE_PASSWORD')) {\n"
                  "                signingConfig signingConfigs.release\n"
                  "            }\n"
                  "        }\n"
                  "    }",
              )
              p.write_text(s)
              print('signing config applied')
          else:
              print('signing config already present')
          EOF

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
